size="19" fill="#555">A packet split in two and slid past itself</text><text x="90.0" y="868" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">— the way GoodbyeDPI fragments traffic</text><rect x="562.667" y="150" width="474.667" height="774" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path d="M76 40 H94 A12 12 0 0 1 106 52 V204 A12 12 0 0 1 94 216 H76 A12 12 0 0 1 64 204 V52 A12 12 0 0 1 76 40 Z M126 40 H136 A56 56 0 0 1 136 152 H126 V112 H136 A16 16 0 0 0 136 80 H126 Z" fill="#000" fill-rule="evenodd"/></svg></g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" x="592.667" y="514" width="414.667" height="120" preserveAspectRatio="xMidYMid meet"><path d="M76 40 H94 A12 12 0 0 1 106 52 V204 A12 12 0 0 1 94 216 H76 A12 12 0 0 1 64 204 V52 A12 12 0 0 1 76 40 Z M126 40 H136 A56 56 0 0 1 136 152 H126 V112 H136 A16 16 0 0 0 136 80 H126 Z" fill="#000" fill-rule="evenodd"/><text x="280" y="170" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-weight="600" font-size="128" letter-spacing="-3" fill="#000">PassDPI</text></svg></g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="660" width="64" height="64" preserveAspectRatio="xMidYMid meet"><path d="M76 40 H94 A12 12 0 0 1 106 52 V204 A12 12 0 0 1 94 216 H76 A12 12 0 0 1 64 204 V52 A12 12 0 0 1 76 40 Z M126 40 H136 A56 56 0 0 1 136 152 H126 V112 H136 A16 16 0 0 0 136 80 H126 Z" fill="#000" fill-rule="evenodd"/></svg></g><text x="624.667" y="744" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="682.667" y="692" width="32" height="32" preserveAspectRatio="xMidYMid meet"><path d="M76 40 H94 A12 12 0 0 1 106 52 V204 A12 12 0 0 1 94 216 H76 A12 12 0 0 1 64 204 V52 A12 12 0 0 1 76 40 Z M126 40 H136 A56 56 0 0 1 136 152 H126 V112 H136 A16 16 0 0 0 136 80 H126 Z" fill="#000" fill-rule="evenodd"/></svg></g><text x="698.667" y="744" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">32px</text><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="740.667" y="708" width="16" height="16" preserveAspectRatio="xMidYMid meet"><path d="M76 40 H94 A12 12 0 0 1 106 52 V204 A12 12 0 0 1 94 216 H76 A12 12 0 0 1 64 204 V52 A12 12 0 0 1 76 40 Z M126 40 H136 A56 56 0 0 1 136 152 H126 V112 H136 A16 16 0 0 0 136 80 H126 Z" fill="#000" fill-rule="evenodd"/></svg></g><text x="748.667" y="744" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">16px</text><text x="592.6666666666667" y="780" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">B · Passage P</text><text x="592.6666666666667" y="814" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">A P whose bowl never touches the stem: the</text><text x="592.6666666666667" y="840" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">gap is the way through</text><rect x="1065.33" y="150" width="474.667" height="774" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1095.33" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path d="M34 56 A8 8 0 0 1 42 48 H54 A8 8 0 0 1 62 56 V114 H34 Z M34 142 H62 V200 A8 8 0 0 1 54 208 H42 A8 8 0 0 1 34 200 Z M82 56 A8 8 0 0 1 90 48 H102 A8 8 0 0 1 110 56 V11