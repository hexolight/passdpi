name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PassDpi.sln

      - name: Build
        run: dotnet build PassDpi.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/PassDpi.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}".TrimStart('v') : ""
          ./build/publish.ps1 -Version $v

      - uses: actions/upload-artifact@v7
        with:
          name: PassDPI-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PassDPI-win-x64
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            *.zip
            *.sha256
